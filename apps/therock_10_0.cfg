[app_info]
APP_NAME=therock
APP_VERSION=release/therock-10.0
PATCH_DIR=release
REPO_URL=https://github.com/rocm/therock
# PROP_FETCH_REPO_TAGS=YES --> download source code with full history and tags
# DEFAULT VALUE is NO
# PROP_FETCH_REPO_TAGS=NO

# default value is TRUE
# but we need to set this to NO to build
# ROCM_SDK without using the compilers, tools, libraries and header files
# from the rocm_sdk itself
PROP_IS_ROCM_SDK_USED=NO
ROCM_SDK_INSTALL_DIR_BASENAME=rocm_10_0

CMD_EXEC_DIR=${RCB_APP_SRC_DIR}

CMD_CLEAN=RCB_CALLBACK__DELETE_APP_SRC_SUBDIR build
          RCB_CALLBACK__RESET_APP_SRC_REPOSITORY
CMD_PRE_CONFIG = ./rcb_pre_config.py
CMD_CONFIG = ./rcb_config.py
CMD_BUILD = ./rcb_build.py
CMD_INSTALL = ./rcb_install.py
